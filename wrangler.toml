name = "giostre"
main = "worker.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "PARTITA"
class_name = "Partita"

[[durable_objects.bindings]]
name = "ARCHIVIO"
class_name = "Archivio"

# Le migrazioni sono cumulative e Cloudflare non riesegue quelle già applicate:
# la v1 risulta fatta dal primo deploy, quindi la classe nuova va introdotta
# con un tag mai usato prima.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Partita"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Archivio"]
